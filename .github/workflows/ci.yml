name: CI

on:
  workflow_dispatch:
    inputs:
      artifact-run-id:
        description: 'Existing artifact run to replay; empty builds the selected ports'
        required: false
        type: string
      consumer-ports:
        description: 'Optional JSON array of primary port directories for debugging; empty selects all'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - "ports/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/bump.yml"
      - ".github/scripts/validate-local-publish.sh"
      - ".github/scripts/build-port.sh"
      - ".github/scripts/fetch-published.mjs"
      - ".github/scripts/fetch-published.test.mjs"
      - ".github/scripts/tool-versions.json"
      - ".github/scripts/ci-workflow.test.mjs"
      - ".github/scripts/run-port-consumer.mjs"
      - ".github/scripts/run-install-matrix.mjs"
      - ".github/scripts/consumer-plan.mjs"
      - ".github/scripts/consumer-plan.test.mjs"
      - ".github/scripts/install-matrix.test.mjs"
      - ".github/scripts/installed-package.mjs"
      - ".github/scripts/consumer-coverage.mjs"
      - ".github/scripts/consumer-browser.mjs"
      - ".github/scripts/setup-ci-runner.sh"
      - ".github/actions/consumer-job/action.yml"
      - ".github/actions/install-matrix/action.yml"
      - ".github/scripts/ci-time-service-compat.sh"
      - ".github/fixtures/consumer/**"
      - "cli/**"
      - "test/**"
      - "package.json"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "ports/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/bump.yml"
      - ".github/scripts/validate-local-publish.sh"
      - ".github/scripts/build-port.sh"
      - ".github/scripts/fetch-published.mjs"
      - ".github/scripts/fetch-published.test.mjs"
      - ".github/scripts/tool-versions.json"
      - ".github/scripts/ci-workflow.test.mjs"
      - ".github/scripts/run-port-consumer.mjs"
      - ".github/scripts/run-install-matrix.mjs"
      - ".github/scripts/consumer-plan.mjs"
      - ".github/scripts/consumer-plan.test.mjs"
      - ".github/scripts/install-matrix.test.mjs"
      - ".github/scripts/installed-package.mjs"
      - ".github/scripts/consumer-coverage.mjs"
      - ".github/scripts/consumer-browser.mjs"
      - ".github/scripts/setup-ci-runner.sh"
      - ".github/actions/consumer-job/action.yml"
      - ".github/actions/install-matrix/action.yml"
      - ".github/scripts/ci-time-service-compat.sh"
      - ".github/fixtures/consumer/**"
      - "cli/**"
      - "test/**"
      - "package.json"

permissions:
  contents: read
  actions: read

concurrency:
  # Only pull_request runs share a group (superseded runs are cancelled). Push and manual runs get a
  # unique group: sharing one would let a burst of merges cancel each other's queued main runs.
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 检测变化的文件并截取 ports/<letter>/<port> 目录
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      build-matrix: ${{ steps.set-matrix.outputs.build-matrix }}
      fetch-matrix: ${{ steps.set-matrix.outputs.fetch-matrix }}
      publish: ${{ steps.set-matrix.outputs.publish }}
      publish-order: ${{ steps.set-matrix.outputs.publish-order }}
      consumer-enabled: ${{ steps.set-matrix.outputs.consumer-enabled }}
      consumer-ports: ${{ steps.set-matrix.outputs.consumer-ports }}
      generic-enabled: ${{ steps.set-matrix.outputs.generic-enabled }}
      generic-ports: ${{ steps.set-matrix.outputs.generic-ports }}
      replay: ${{ steps.set-matrix.outputs.replay }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find changed NPMBUILD ports
        id: set-matrix
        env:
          CONSUMER_SELECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.consumer-ports || '' }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact-run-id }}
          BUILD_ALL: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          REGISTRY_CHECK: 'true'
          PUBLISH_CHECK: ${{ github.event_name == 'push' && 'true' || 'false' }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            printf '.github/scripts/run-port-consumer.mjs\n' | node .github/scripts/consumer-plan.mjs >> "$GITHUB_OUTPUT"
            if [ -n "$ARTIFACT_RUN_ID" ]; then
              echo 'matrix=[]' >> "$GITHUB_OUTPUT"
              echo 'build-matrix=[]' >> "$GITHUB_OUTPUT"
              echo 'fetch-matrix=[]' >> "$GITHUB_OUTPUT"
              echo 'replay=true' >> "$GITHUB_OUTPUT"
            else
              echo 'replay=false' >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          BASE=${{ github.event.before }}
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          fi

          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD^)
          fi

          changed=$(git diff --name-only --diff-filter=d "$BASE" HEAD)
          printf '%s\n' "$changed" | node .github/scripts/consumer-plan.mjs >> "$GITHUB_OUTPUT"

      - name: Test workflow constraints
        run: node --test .github/scripts/ci-workflow.test.mjs

      - name: Test consumer planning
        run: node --test .github/scripts/consumer-plan.test.mjs

      - name: Test published tarball fetching
        run: node --test .github/scripts/fetch-published.test.mjs

      - name: Test NPMBUILD manager and all port metadata
        run: |
          node --test test/*.test.mjs
          cli/npm-ports lint --all

      - name: Report consumer coverage
        run: node .github/scripts/consumer-coverage.mjs >> "$GITHUB_STEP_SUMMARY"

  external-build-approval:
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.matrix != '[]' &&
      github.event_name == 'pull_request' &&
      contains(fromJson('["FIRST_TIMER","FIRST_TIME_CONTRIBUTOR"]'), github.event.pull_request.author_association) &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-slim
    environment: external-ci
    steps:
      - name: Record approval for first-time external contributors
        run: echo 'Full builds approved for this first-time external contribution.'

  # 构建输入变了或 npm 上还没有这个版本的 port：构建、私仓验证并上传 artifact；发布由 conclusion 之后的 publish job 负责
  build:
    needs: [detect-changes, external-build-approval]
    if: >
      always() &&
      needs.detect-changes.result == 'success' &&
      (needs.external-build-approval.result == 'success' || needs.external-build-approval.result == 'skipped') &&
      needs.detect-changes.outputs.build-matrix != '[]'
    strategy:
      max-parallel: 20
      matrix:
        dir: ${{ fromJson(needs.detect-changes.outputs.build-matrix) }}
      fail-fast: false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    container:
      image: ghcr.io/ohos-npm-ports/ci-runner:latest
      volumes:
        - /tmp/node24:/__e/node24:rw,rshared
    steps:
      # 预置 Node.js。这版 Node.js 仅供 actions/checkout 使用，不会对构建业务产生干扰。
      - name: Setup node for actions
        run: |
          curl -fLO https://github.com/hqzing/ohos-node/releases/download/v24.2.0/node-v24.2.0-openharmony-arm64.tar.gz
          mkdir /__e/node24/bin
          tar -zxf node-v24.2.0-openharmony-arm64.tar.gz
          cp node-v24.2.0-openharmony-arm64/bin/node /__e/node24/bin/node
          rm -rf node-v24.2.0-openharmony-arm64*

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: sh .github/scripts/build-port.sh "${{ matrix.dir }}"

      - name: Validate publish through temporary Verdaccio
        id: registry
        run: sh .github/scripts/validate-local-publish.sh "${{ matrix.dir }}"

      - name: Upload exact pre-release packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.registry.outputs.artifact-name }}
          path: ${{ matrix.dir }}/artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # 构建输入没变、版本已在 npm 上的 port 不重建：直接取已发布的 tarball，让 consumer 测的正是用户会装到的包
  fetch:
    needs: [detect-changes, external-build-approval]
    if: >
      always() &&
      needs.detect-changes.result == 'success' &&
      (needs.external-build-approval.result == 'success' || needs.external-build-approval.result == 'skipped') &&
      needs.detect-changes.outputs.fetch-matrix != '[]'
    strategy:
      max-parallel: 20
      matrix:
        dir: ${{ fromJson(needs.detect-changes.outputs.fetch-matrix) }}
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/checkout@v7
      - name: Download the published tarballs
        id: published
        run: node .github/scripts/fetch-published.mjs "${{ matrix.dir }}"
      - name: Upload published packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.published.outputs.artifact-name }}
          path: ${{ matrix.dir }}/artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # build 和 fetch 都结束后 consumer 才开始；个别 port 构建失败时，其余 consumer 照常运行
  artifacts:
    needs: [detect-changes, external-build-approval, build, fetch]
    if: >
      always() &&
      needs.detect-changes.result == 'success' &&
      (needs.external-build-approval.result == 'success' || needs.external-build-approval.result == 'skipped') &&
      (needs.build.result == 'success' || needs.build.result == 'failure' || needs.detect-changes.outputs.build-matrix == '[]') &&
      (needs.fetch.result == 'success' || needs.fetch.result == 'failure' || needs.detect-changes.outputs.fetch-matrix == '[]')
    runs-on: ubuntu-slim
    steps:
      - run: echo 'The artifacts of this run are uploaded.'

  consumer-install:
    needs: [detect-changes, artifacts]
    if: >
      always() &&
      needs.artifacts.result == 'success' &&
      needs.detect-changes.outputs.generic-enabled == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { platform: win32, arch: x64, runner: windows-2025 }
          - { platform: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { platform: linux, arch: x64, runner: ubuntu-24.04 }
          - { platform: darwin, arch: arm64, runner: macos-15 }
    name: consumer-install (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-matrix
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          ports: ${{ needs.detect-changes.outputs.generic-ports }}
          replay: ${{ needs.detect-changes.outputs.replay }}
          artifact-run-id: ${{ inputs.artifact-run-id }}
          token: ${{ github.token }}

  consumer-install-openharmony:
    needs: [detect-changes, artifacts]
    if: >
      always() &&
      needs.artifacts.result == 'success' &&
      needs.detect-changes.outputs.generic-enabled == 'true'
    name: consumer-install (openharmony-arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-matrix
        with:
          platform: openharmony
          arch: arm64
          ports: ${{ needs.detect-changes.outputs.generic-ports }}
          replay: ${{ needs.detect-changes.outputs.replay }}
          artifact-run-id: ${{ inputs.artifact-run-id }}
          token: ${{ github.token }}

  consumer-tests-windows-x64:
    needs: [detect-changes, artifacts]
    if: always() && needs.artifacts.result == 'success' && needs.detect-changes.outputs.consumer-enabled == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        port: ${{ fromJson(needs.detect-changes.outputs.consumer-ports) }}
    name: consumer (${{ matrix.port }}, win32-x64)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/consumer-job
        with:
          port: ${{ matrix.port }}
          platform: win32
          arch: x64
          replay: ${{ needs.detect-changes.outputs.replay }}
          artifact-run-id: ${{ inputs.artifact-run-id }}
          token: ${{ github.token }}

  consumer-tests-linux-arm64:
    needs: [detect-changes, artifacts]
    if: always() && needs.artifacts.result == 'success' && needs.detect-changes.outputs.consumer-enabled == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        port: ${{ fromJson(needs.detect-changes.outputs.consumer-ports) }}
    name: consumer (${{ matrix.port }}, linux-arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/consumer-job
        with:
          port: ${{ matrix.port }}
          platform: linux
          arch: arm64
          replay: ${{ needs.detect-changes.outputs.replay }}
          artifact-run-id: ${{ inputs.artifact-run-id }}
          token: ${{ github.token }}

  consumer-tests-linux-x64:
    needs: [detect-changes, artifacts]
    if: always() && needs.artifacts.result == 'success' && needs.detect-changes.outputs.consumer-enabled == 'true'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        port: ${{ fromJson(needs.detect-changes.outputs.consumer-ports) }}
    name: consumer (${{ matrix.port }}, linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/consumer-job
        with:
          port: ${{ matrix.port }}
          platform: linux
          arch: x64
          replay: ${{ needs.detect-changes.outputs.replay }}
          artifact-run-id: ${{ inputs.artifact-run-id }}
          token: ${{ github.token }}

  consumer-tests-darwin-arm64:
    needs: [detect-changes, artifacts]
    if: always() && needs.artifacts.result == 'success' && needs.detect-changes.outputs.consumer-enabled == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        port: ${{ fromJson(needs.detect-changes.outputs.consumer-ports) }}
    name: consumer (${{ matrix.port }}, darwin-arm64)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/consumer-job
        with:
          port: ${{ matrix.port }}
          platform: darwin
          arch: arm64
          replay: ${{ needs.detect-changes.outputs.replay }}
          artifact-run-id: ${{ inputs.artifact-run-id }}
          token: ${{ github.token }}

  consumer-tests-openharmony:
    needs: [detect-changes, artifacts]
    if: always() && needs.artifacts.result == 'success' && needs.detect-changes.outputs.consumer-enabled == 'true'
    name: consumer (${{ matrix.port }}, openharmony-arm64)
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        port: ${{ fromJson(needs.detect-changes.outputs.consumer-ports) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Select closure artifacts
        id: closure-artifacts
        env:
          CONSUMER_PORT: ${{ matrix.port }}
        shell: bash
        run: echo "pattern=$(node .github/scripts/consumer-plan.mjs artifact-pattern "$CONSUMER_PORT")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ steps.closure-artifacts.outputs.pattern }}
          path: .port-artifacts
          run-id: ${{ inputs.artifact-run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Prepare optional browser service
        env:
          CONSUMER_PORT: ${{ matrix.port }}
        run: node .github/scripts/consumer-browser.mjs "$CONSUMER_PORT" container
      - name: Override port test on OpenHarmony
        env:
          CONSUMER_PORT: ${{ matrix.port }}
          REPLAY_ARTIFACTS: ${{ needs.detect-changes.outputs.replay }}
          EXPECTED_PLATFORM: openharmony
          EXPECTED_ARCH: arm64
        run: |
          docker run --rm --add-host=host.docker.internal:host-gateway \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            -w "$GITHUB_WORKSPACE" \
            -e CONSUMER_PORT -e REPLAY_ARTIFACTS -e EXPECTED_PLATFORM -e EXPECTED_ARCH \
            -e GITHUB_SHA -e GITHUB_STEP_SUMMARY -e PORT_TEST_BROWSER_ENDPOINT \
            -e HOMEBREW_NO_AUTO_UPDATE=1 -e HOMEBREW_NO_INSTALL_UPGRADE=1 \
            ghcr.io/ohos-npm-ports/ci-runner:latest \
            sh -ec '. .github/scripts/setup-ci-runner.sh; exec node .github/scripts/run-port-consumer.mjs .port-artifacts'

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: consumer-logs-${{ strategy.job-index }}-openharmony-arm64
          path: |
            .consumer-logs/
            .consumer-browser.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
      - name: Stop optional browser service
        if: always()
        shell: bash
        run: |
          node -e "const fs=require('node:fs');if(fs.existsSync('.consumer-browser.pid')){try{process.kill(Number(fs.readFileSync('.consumer-browser.pid','utf8')))}catch{}}"
      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

  conclusion:
    needs:
      - detect-changes
      - external-build-approval
      - build
      - fetch
      - consumer-install
      - consumer-install-openharmony
      - consumer-tests-windows-x64
      - consumer-tests-linux-arm64
      - consumer-tests-linux-x64
      - consumer-tests-darwin-arm64
      - consumer-tests-openharmony
    if: always()
    runs-on: ubuntu-slim
    steps:
      - name: Check the complete CI result
        env:
          DETECT: ${{ needs.detect-changes.result }}
          APPROVAL: ${{ needs.external-build-approval.result }}
          BUILD: ${{ needs.build.result }}
          BUILD_MATRIX: ${{ needs.detect-changes.outputs.build-matrix }}
          FETCH: ${{ needs.fetch.result }}
          FETCH_MATRIX: ${{ needs.detect-changes.outputs.fetch-matrix }}
          GENERIC_ENABLED: ${{ needs.detect-changes.outputs.generic-enabled }}
          INSTALL_HOST: ${{ needs.consumer-install.result }}
          INSTALL_OHOS: ${{ needs.consumer-install-openharmony.result }}
          CONSUMER_ENABLED: ${{ needs.detect-changes.outputs.consumer-enabled }}
          WINDOWS: ${{ needs.consumer-tests-windows-x64.result }}
          LINUX_ARM64: ${{ needs.consumer-tests-linux-arm64.result }}
          LINUX_X64: ${{ needs.consumer-tests-linux-x64.result }}
          DARWIN_ARM64: ${{ needs.consumer-tests-darwin-arm64.result }}
          OPENHARMONY: ${{ needs.consumer-tests-openharmony.result }}
        run: |
          node -e '
            const failures = [];
            const require = (condition, message) => { if (!condition) failures.push(message); };
            require(process.env.DETECT === "success", `detect-changes: ${process.env.DETECT}`);
            require(["success", "skipped"].includes(process.env.APPROVAL), `external approval: ${process.env.APPROVAL}`);
            if (process.env.BUILD_MATRIX && process.env.BUILD_MATRIX !== "[]") require(process.env.BUILD === "success", `build: ${process.env.BUILD}`);
            else require(["success", "skipped"].includes(process.env.BUILD), `build: ${process.env.BUILD}`);
            if (process.env.FETCH_MATRIX && process.env.FETCH_MATRIX !== "[]") require(process.env.FETCH === "success", `fetch: ${process.env.FETCH}`);
            else require(["success", "skipped"].includes(process.env.FETCH), `fetch: ${process.env.FETCH}`);
            if (process.env.GENERIC_ENABLED === "true") {
              for (const name of ["INSTALL_HOST", "INSTALL_OHOS"]) require(process.env[name] === "success", `${name}: ${process.env[name]}`);
            }
            if (process.env.CONSUMER_ENABLED === "true") {
              for (const name of ["WINDOWS", "LINUX_ARM64", "LINUX_X64", "DARWIN_ARM64", "OPENHARMONY"])
                require(process.env[name] === "success", `${name}: ${process.env[name]}`);
            }
            if (failures.length) throw new Error(failures.join("; "));
            console.log("All required build and consumer checks passed");
          '

  # 唯一持有 npm 凭据的 job：conclusion 全绿后，发布本轮已验证的同一批 tarball
  publish:
    needs: [detect-changes, conclusion]
    if: >
      needs.conclusion.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository == 'ohos-npm-ports/ohos-npm-ports' &&
      needs.detect-changes.outputs.publish != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/checkout@v7
      - name: Download the verified artifacts of this run
        uses: actions/download-artifact@v8
        with:
          pattern: port-*
          path: .port-artifacts
          github-token: ${{ github.token }}
      # 凭据只写进文件；下面执行 NPMBUILD 的步骤环境里没有它
      - name: Write npm credentials
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          umask 077
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/publish.npmrc"
      # 依赖先发；任何一个 port 失败就停，重跑时已发布的版本会被跳过
      - name: Publish verified tarballs
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/publish.npmrc
          PUBLISH_ORDER: ${{ needs.detect-changes.outputs.publish-order }}
        run: |
          for dir in $(printf '%s' "$PUBLISH_ORDER" | jq -r '.[]'); do
            mkdir -p "$dir/artifacts"
            cp -R ".port-artifacts/port-$(basename "$dir")/." "$dir/artifacts/"
            cli/npm-ports publish "$dir" --skip-existing --expect-sha "$GITHUB_SHA"
          done
