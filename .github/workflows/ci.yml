name: CI

on:
  push:
    paths:
      - "ports/**"
  pull_request:
    paths:
      - "ports/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/validate-local-publish.sh"
      - ".github/scripts/tool-versions.json"
      - ".github/scripts/ci-workflow.test.mjs"

permissions:
  contents: read

concurrency:
  # Only pull_request runs share a group (superseded runs are cancelled). Push runs get a unique group:
  # sharing one would let a burst of merges cancel each other's queued main runs.
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 检测哪些目录的文件有变化，截取出 ports/<name>/<version> 这一级
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Test workflow constraints
        run: node --test .github/scripts/ci-workflow.test.mjs

      - name: Find changed port versions
        id: set-matrix
        run: |
          BASE=${{ github.event.before }}
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          fi

          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD^)
          fi

          dirs=$(git diff --name-only --diff-filter=d "$BASE" HEAD \
                 | grep '^ports/' \
                 | sed -E 's|^(ports/[^/]+/[^/]+)/.*|\1|' \
                 | sort -u \
                 | jq -R -s -c 'split("\n")[:-1]')

          echo "matrix=$dirs" >> $GITHUB_OUTPUT

  # 对于发生变化的目录，进去执行里面的 build.sh 和 publish.sh
  build-and-publish:
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '[]'
    strategy:
      matrix:
        dir: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/ohos-npm-ports/ci-runner:latest
      volumes:
        - /tmp/node24:/__e/node24:rw,rshared
    steps:
      # 预置 Node.js。这版 Node.js 仅供 actions/checkout 使用，不会对构建业务产生干扰。
      - name: Setup node for actions
        run: |
          curl -fLO https://github.com/hqzing/ohos-node/releases/download/v24.2.0/node-v24.2.0-openharmony-arm64.tar.gz
          mkdir /__e/node24/bin
          tar -zxf node-v24.2.0-openharmony-arm64.tar.gz
          cp node-v24.2.0-openharmony-arm64/bin/node /__e/node24/bin/node
          rm -rf node-v24.2.0-openharmony-arm64*

      - name: Checkout
        uses: actions/checkout@v5

      - name: Build
        # Three things keep the brew toolchain usable on an image that lags behind the brew formulas:
        # no upgrade of installed formulae in the middle of build.sh (it fails on a lock), fresh formula metadata (without
        # it linking dependencies fails), and the brew rust first on PATH (rustup would fetch a toolchain
        # with no OpenHarmony host build).
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_UPGRADE: "1"
        run: |
          brew update
          export PATH="$(brew --prefix rust)/bin:$PATH"
          cd "${{ matrix.dir }}"
          ./build.sh

      - name: Validate publish through temporary Verdaccio
        id: registry
        run: sh .github/scripts/validate-local-publish.sh "${{ matrix.dir }}"

      # 只有直接 push 或 PR 被合入时才会进行发布
      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ohos-npm-ports/ohos-npm-ports'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          cd "${{ matrix.dir }}"
          ./publish.sh
