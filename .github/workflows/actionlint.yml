name: actionlint

# Static check of every .github/workflows/*.yml on push + PR — YAML syntax,
# unknown context/expression typos, and (via the bundled shellcheck)
# unquoted-variable / quoting bugs in `run:` blocks. Borrowed from the
# Harmonybrew tap's workflow of the same name.

on:
  push:
    branches: [main]
    paths: [".github/workflows/**"]
  pull_request:
    paths: [".github/workflows/**"]

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_level: error
