name: PR commit count

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-commit-count-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  single-commit:
    name: Require exactly one commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check PR commit count
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          count=$(git rev-list --count "$BASE..$HEAD")
          echo "PR contains $count commit(s)."
          if [ "$count" -ne 1 ]; then
            echo "::error::Each PR must contain exactly one commit; found $count. Squash the commits and push again."
            exit 1
          fi
