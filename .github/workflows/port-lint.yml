name: NPMBUILD lint

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "ports/**"
      - ".github/workflows/port-lint.yml"
      - ".github/scripts/**"

defaults:
  run:
    shell: bash

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: port-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find changed ports
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          dirs=$(git diff --name-only --diff-filter=d "$BASE" "$HEAD" \
                 | grep '^ports/' \
                 | sed -nE 's|^(ports/[^/]+/[^/]+)/.*|\1|p' \
                 | sort -u \
                 | jq -R -s -c 'split("\n")[:-1]')
          echo "changed=$dirs" >> "$GITHUB_OUTPUT"

  lint:
    needs: detect
    if: needs.detect.outputs.changed != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: NPMBUILD lint
        run: |
          echo '${{ needs.detect.outputs.changed }}' | jq -r '.[]' \
            | while IFS= read -r dir; do cli/npm-ports lint "$dir"; done
      - name: Warn about changed ports that keep their version
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          git diff --name-only "$BASE" "$HEAD" | node .github/scripts/warn-unbumped-ports.mjs "$RUNNER_TEMP/base"

  lint-commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test lint and reporting scripts
        run: node --test .github/scripts/lint-commit-messages.test.mjs .github/scripts/gate-report-comment.test.mjs
      - name: Lint commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/lint-commit-messages.mjs

  gate-report:
    needs: [detect, lint, lint-commits]
    if: always() && needs.detect.outputs.changed != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Post summary comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          CHANGED_JSON: ${{ needs.detect.outputs.changed }}
          LINT_RESULT: ${{ needs.lint.result }}
          COMMIT_RESULT: ${{ needs.lint-commits.result }}
        run: node .github/scripts/gate-report-comment.mjs
