name: ports-report

# 定期生成全量 port 版本差异报告，仅供维护者处理。

on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 11:00 CST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    if: github.repository == 'ohos-npm-ports/ohos-npm-ports'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Full ports report
        run: |
          {
            echo "### ports report @ $(date -u +%FT%TZ)"
            echo
            echo "| port | 目录最新版 | 上游最新版 | 状态 | 白名单 |"
            echo "|---|---|---|---|---|"
            .github/scripts/check-upstream-versions.sh |
            awk -F'\t' '{
              status = ($4 == "behind" && $5 == "true") ? "**behind**" : $4
              printf "| %s | %s | %s | %s | %s |\n", $1, $2, $3, status, $5
            }'
          } >> "$GITHUB_STEP_SUMMARY"
