<!doctype html><meta charset="utf-8"><title>NW bridge smoke</title><pre id="result">Starting</pre>
<script>
const settings = require('./settings.json');
const fs = require('node:fs');
const filename = require('path').join(__dirname, 'result.json');
const result = { settings, platform: require('os').platform(), arch: process.arch,
  text: JSON.parse(fs.readFileSync('settings.json', 'utf8')).message,
  args: nw.App.argv, alias: nw.require === require, node: process.versions.node,
  hasNativeNW: typeof process.versions.nw !== 'undefined' };
fs.writeFileSync(filename, JSON.stringify(result));
window.bridgeResult = result;
nw.Window.get().on('loaded', () => {
  document.getElementById('result').textContent = JSON.stringify(result);
  window.bridgeLoaded = true;
});
</script>
